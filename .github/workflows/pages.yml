name: Deploy Pages

on:
  push:
    branches:
      - main

jobs:

  # ── Validate SVGs + run the npm package test suite ────────────────────────
  validate:
    name: Validate SVGs & run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate all SVGs
        run: |
          find . -name "*.svg" -not -path "./.git/*" | while read f; do
            echo "Validating $f"
            xmllint --noout "$f" || exit 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS deps
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test

  # ── Deploy GitHub Pages ───────────────────────────────────────────────────
  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
