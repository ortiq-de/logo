name: Release Bundle

on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  # ── Validate SVGs ─────────────────────────────────────────────────────────
  validate:
    name: Validate SVGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate all SVGs
        run: |
          find . -name "*.svg" -not -path "./.git/*" | while read f; do
            echo "Validating $f"
            xmllint --noout "$f" || exit 1
          done

  # ── Build release bundle + publish npm ───────────────────────────────────
  bundle:
    name: Build & Release Bundle
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ortiq-de'

      - name: Install system deps (rsvg-convert, imagemagick, zip)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick zip

      - name: Install JS deps
        run: npm install --ignore-scripts

      - name: Build bundle (SVGs + PNGs + favicons + TypeScript defs)
        run: node scripts/bundle.mjs

      - name: Run tests
        run: npm test -- --reporter=verbose --reporter=json --outputFile=test-results.json | tee test-output.log

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            test-output.log

      - name: Create release archives
        run: |
          VERSION=${GITHUB_REF_NAME}
          zip -r "ortiq-logo-${VERSION}.zip" dist/
          tar -czf "ortiq-logo-${VERSION}.tar.gz" dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ortiq-logo-*.zip
            ortiq-logo-*.tar.gz
          generate_release_notes: true
          body: |
            ## Ortiq Logo Bundle ${{ github.ref_name }}

            **GitHub Pages:** https://ortiq-de.github.io/logo/

            ### Artifacts in this release
            | File | Contents |
            |------|----------|
            | `ortiq-logo-${{ github.ref_name }}.zip` | Full bundle |
            | `dist/index.js` | CJS module |
            | `dist/index.esm.js` | ES module |
            | `dist/index.d.ts` | TypeScript definitions |
            | `dist/index.css` | CSS custom properties |
            | `dist/favicons/` | favicon.ico, apple-touch-icon, all PNG sizes |
            | `dist/site.webmanifest` | PWA manifest |
            | `dist/palette.json` | Brand palette tokens |
            | `dist/svgs/` | All SVG sources |

            ### Install (GitHub Packages)
            ```
            # .npmrc
            @ortiq-de:registry=https://npm.pkg.github.com

            npm install @ortiq-de/logo
            ```

            ### Quick use
            ```js
            import { base, stateLoading, http404, palette } from '@ortiq-de/logo'
            import '@ortiq-de/logo/css'
            ```

            ### Favicon HTML
            ```html
            <link rel="icon" type="image/svg+xml" href="base.svg">
            <link rel="apple-touch-icon" href="apple-touch-icon.png">
            <link rel="manifest" href="site.webmanifest">
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package version
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish this version's test-log page ─────────────────────────────────
  # Runs only after `bundle` (tests + publish) succeeds, so a page only ever appears for a
  # version that actually shipped. Checks out main fresh (not the tag's detached HEAD) so the
  # commit doesn't overwrite main with the tagged tree's other files — it only ever touches
  # test-results/. Pushing to main re-triggers pages.yml, which deploys the raw repo root, so
  # this page goes live with no pages.yml changes needed.
  publish-test-report:
    name: Publish test report page
    runs-on: ubuntu-latest
    needs: bundle
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Build test-results/<version>.html + index.html
        run: node scripts/build-test-report.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-results/
          git diff --cached --quiet && exit 0
          git commit -m "Add test results for ${{ github.ref_name }}"
          git push origin HEAD:main
