<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <style>
    /* warning — an alert flare chases fast around all six facets, 800ms loop */
    @keyframes warn-flare {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.8); }
    }
    #p0 { animation: warn-flare 0.8s ease-in-out 0s    infinite; }
    #p1 { animation: warn-flare 0.8s ease-in-out 0.13s infinite; }
    #p2 { animation: warn-flare 0.8s ease-in-out 0.26s infinite; }
    #p3 { animation: warn-flare 0.8s ease-in-out 0.39s infinite; }
    #p4 { animation: warn-flare 0.8s ease-in-out 0.52s infinite; }
    #p5 { animation: warn-flare 0.8s ease-in-out 0.65s infinite; }
  </style>
