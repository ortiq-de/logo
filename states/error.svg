<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <style>
    /* error — frustrated shaking head, sharp × 3, then pause, loops */
    @keyframes frustrated {
      0%, 55%, 100% { transform: translateX(0); }
      5%   { transform: translateX(-22px); }
      12%  { transform: translateX(22px); }
      19%  { transform: translateX(-19px); }
      26%  { transform: translateX(19px); }
      33%  { transform: translateX(-11px); }
      40%  { transform: translateX(11px); }
      46%  { transform: translateX(0); }
    }
    #mark { animation: frustrated 2.2s ease-in-out infinite; }
  </style>
  <g id="mark" fill="currentColor">
    <path id="p0" d="M 270 22 L 484.77 146 L 407.46 190.64 L 270 111.28 Z" opacity="0.53"/>
    <path id="p1" d="M 484.77 146 L 484.77 394 L 407.46 349.36 L 407.46 190.64 Z" opacity="0.35"/>
    <path id="p2" d="M 484.77 394 L 270 518 L 270 428.72 L 407.46 349.36 Z" opacity="0.44"/>
    <path id="p3" d="M 270 518 L 55.23 394 L 132.54 349.36 L 270 428.72 Z" opacity="0.50"/>
    <path id="p4" d="M 55.23 394 L 55.23 146 L 132.54 190.64 L 132.54 349.36 Z" opacity="0.74"/>
    <path id="p5" d="M 55.23 146 L 270 22 L 270 111.28 L 132.54 190.64 Z" opacity="0.62"/>
    <circle id="pupil" cx="270" cy="270" r="59.52"/>
  </g>
</svg>
