<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <style>
    /* success — happy spring jump with a burst of light at the peak, settles, loops */
    @keyframes joy {
      0%, 65%, 100% { transform: scale(1); }
      15%  { transform: scale(1.2); }
      28%  { transform: scale(0.9); }
      40%  { transform: scale(1.07); }
      52%  { transform: scale(0.98); }
      60%  { transform: scale(1); }
    }
    @keyframes joy-flash {
      0%, 100% { filter: brightness(1); }
      15%       { filter: brightness(1.6); }
    }
    #mark {
      transform-box: view-box;
      transform-origin: 270px 270px;
      animation: joy 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    #mark path { animation: joy-flash 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
  </style>
  <g id="mark" fill="currentColor">
    <path id="p0" d="M 270 22 L 484.77 146 L 344.1 227.22 L 270 184.44 Z" opacity="0.53"/>
    <path id="p1" d="M 484.77 146 L 484.77 394 L 344.1 312.78 L 344.1 227.22 Z" opacity="0.35"/>
    <path id="p2" d="M 484.77 394 L 270 518 L 270 355.56 L 344.1 312.78 Z" opacity="0.44"/>
    <path id="p3" d="M 270 518 L 55.23 394 L 195.9 312.78 L 270 355.56 Z" opacity="0.50"/>
    <path id="p4" d="M 55.23 394 L 55.23 146 L 195.9 227.22 L 195.9 312.78 Z" opacity="0.74"/>
    <path id="p5" d="M 55.23 146 L 270 22 L 270 184.44 L 195.9 227.22 Z" opacity="0.62"/>
  </g>
</svg>
