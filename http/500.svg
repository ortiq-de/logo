<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <style>
    /* 500 — dying machine: glitch → dim → death rattle → flicker → repeat */
    @keyframes dying {
      0%   { transform: translate(0,0);       opacity: 1;    filter: saturate(1); }
      3%   { transform: translate(11px,-5px); opacity: 0.9;  filter: saturate(1); }
      6%   { transform: translate(-11px,5px); opacity: 0.7;  filter: saturate(0.7); }
      9%   { transform: translate(5px,-5px);  opacity: 0.45; filter: saturate(0.5); }
      13%  { transform: translate(0,0);       opacity: 0.2;  filter: saturate(0.3); }
      /* hold dead */
      72%  { transform: translate(0,0);       opacity: 0.2;  filter: saturate(0.3); }
      /* death rattle */
      76%  { transform: translate(5px,0);     opacity: 0.28; filter: saturate(0.35); }
      80%  { transform: translate(0,0);       opacity: 0.2;  filter: saturate(0.3); }
      84%  { transform: translate(-5px,5px);  opacity: 0.26; filter: saturate(0.35); }
      88%  { transform: translate(0,0);       opacity: 0.2;  filter: saturate(0.3); }
      /* flicker before reset */
      93%  { opacity: 0.6; filter: saturate(0.6); }
      96%  { opacity: 1;   filter: saturate(1); }
      100% { opacity: 1;   filter: saturate(1); }
    }
    #mark { animation: dying 4s ease-in-out infinite; }
  </style>
  <g id="mark" fill="currentColor">
    <path id="p0" d="M 270 22 L 484.77 146 L 407.46 190.64 L 270 111.28 Z" opacity="0.53"/>
    <path id="p1" d="M 484.77 146 L 484.77 394 L 407.46 349.36 L 407.46 190.64 Z" opacity="0.35"/>
    <path id="p2" d="M 484.77 394 L 270 518 L 270 428.72 L 407.46 349.36 Z" opacity="0.44"/>
    <path id="p3" d="M 270 518 L 55.23 394 L 132.54 349.36 L 270 428.72 Z" opacity="0.50"/>
    <path id="p4" d="M 55.23 394 L 55.23 146 L 132.54 190.64 L 132.54 349.36 Z" opacity="0.74"/>
    <path id="p5" d="M 55.23 146 L 270 22 L 270 111.28 L 132.54 190.64 Z" opacity="0.62"/>
    <circle id="pupil" cx="270" cy="270" r="59.52"/>
  </g>
</svg>
