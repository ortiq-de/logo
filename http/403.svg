<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="512" height="512">
  <style>
    /* 403 — appears, tries to push through (flushes red), gets refused, collapses. loops. */
    @keyframes refused-loop {
      0%    { transform: scale(0);    opacity: 0;   filter: hue-rotate(0deg); }
      15%   { transform: scale(1.05); opacity: 1;   filter: hue-rotate(0deg); }
      25%   { transform: scale(1);    opacity: 1;   filter: hue-rotate(0deg); }
      40%   { transform: scale(1.08); opacity: 1;   filter: hue-rotate(-20deg); }
      50%   { transform: scale(1.02); opacity: 1;   filter: hue-rotate(0deg); }
      62%   { transform: scale(0.2);  opacity: 0.2; filter: hue-rotate(0deg); }
      80%   { transform: scale(0);    opacity: 0;   filter: hue-rotate(0deg); }
      100%  { transform: scale(0);    opacity: 0;   filter: hue-rotate(0deg); }
    }
    #mark {
      transform-box: view-box;
      transform-origin: 270px 270px;
      animation: refused-loop 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
  <g id="mark" fill="currentColor">
    <path id="p0" d="M 270 22 L 484.77 146 L 344.1 227.22 L 270 184.44 Z" opacity="0.53"/>
    <path id="p1" d="M 484.77 146 L 484.77 394 L 344.1 312.78 L 344.1 227.22 Z" opacity="0.35"/>
    <path id="p2" d="M 484.77 394 L 270 518 L 270 355.56 L 344.1 312.78 Z" opacity="0.44"/>
    <path id="p3" d="M 270 518 L 55.23 394 L 195.9 312.78 L 270 355.56 Z" opacity="0.50"/>
    <path id="p4" d="M 55.23 394 L 55.23 146 L 195.9 227.22 L 195.9 312.78 Z" opacity="0.74"/>
    <path id="p5" d="M 55.23 146 L 270 22 L 270 184.44 L 195.9 227.22 Z" opacity="0.62"/>
  </g>
</svg>
