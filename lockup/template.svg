<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="440" height="112">
  <!--
    Lockup grid (all units in px, viewBox coords):
      Mark area : x=0,  y=0, w=48, h=56  (mark centered: y-offset=4 → 48px tall)
      Gap       : 8px (x=48 to x=56) — do not place content here
      Slot      : x=56, y=0, w=164, h=56 — variable-width sub-brand text
      Baseline  : text baseline at y=37 (optical center of 56px tall container)
      Cap-height: ~24px (matches mark optical center)
  -->

  <!-- Face mark — six-facet hexagon at 48×48, vertically centered in 56px -->
  <svg x="0" y="4" width="48" height="48" viewBox="0 0 540 540">
    <g fill="currentColor">
      <path d="M 270 22 L 484.77 146 L 407.46 190.64 L 270 111.28 Z" opacity="0.53"/>
      <path d="M 484.77 146 L 484.77 394 L 407.46 349.36 L 407.46 190.64 Z" opacity="0.35"/>
      <path d="M 484.77 394 L 270 518 L 270 428.72 L 407.46 349.36 Z" opacity="0.44"/>
      <path d="M 270 518 L 55.23 394 L 132.54 349.36 L 270 428.72 Z" opacity="0.50"/>
      <path d="M 55.23 394 L 55.23 146 L 132.54 190.64 L 132.54 349.36 Z" opacity="0.74"/>
      <path d="M 55.23 146 L 270 22 L 270 111.28 L 132.54 190.64 Z" opacity="0.62"/>
      <circle cx="270" cy="270" r="59.52"/>
    </g>
  </svg>

  <!-- Gap guide (non-exporting, stroke-dasharray) -->
  <line x1="48" y1="4" x2="48" y2="52" stroke="currentColor" stroke-width="0.5"
        stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="56" y1="4" x2="56" y2="52" stroke="currentColor" stroke-width="0.5"
        stroke-dasharray="2,2" opacity="0.3"/>

  <!-- Slot guide box (dashed — non-exporting) -->
  <rect x="56" y="4" width="160" height="48" fill="none"
        stroke="currentColor" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Baseline guide -->
  <line x1="56" y1="37" x2="216" y2="37" stroke="currentColor" stroke-width="0.5"
        stroke-dasharray="1,3" opacity="0.25"/>

  <!-- Slot label -->
  <text x="60" y="36" font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="10" fill="currentColor" opacity="0.35">SUB-BRAND SLOT</text>
</svg>
